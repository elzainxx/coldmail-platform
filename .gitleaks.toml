title = "coldmail-platform"

[extend]
useDefault = true

# The ONE exception, scoped to one rule and one directory of evidence logs.
#
# Docs/history/audit-scratch/ holds CI and replica run logs that the records cite by run ID. Control-plane request-log lines in them
# (`platformapi error <request-id> GET /v1/report: code=not_found …`, `workerlink stream: worker registered id="…"`, `rid=req_<hex>`,
# reason names such as `service_token_invalid_or_missing`) trip `generic-api-key`: the word "api" next to a high-entropy request id.
# Read line by line on 2026-11-09: 297 hits in 6 files, every one a request id, worker id, error-reason name or URL path — no secret.
#
# This does NOT blind the scan, and that is checked, not asserted: a GitHub-token-shaped secret planted inside an allowlisted log is still
# detected (other rules still run there), and a generic-key-shaped secret in any other path is still detected (this rule still runs elsewhere).
# See Docs/history/audit-scratch/README.md.
[[allowlists]]
description = "request ids / worker ids / error-reason names in the cited run logs (not secrets)"
targetRules = ["generic-api-key"]
paths = ['''(^|/)Docs/history/audit-scratch/.*\.log$''']

# The SECOND exception (Phase 2): ONE rule, ONE commit.
#
# Commit 355299a6c605a2ca0601bf58afb0e0468d7fccb0 added tests/harness/m3_live_test.go. Its line 201 is a JSON map entry `"smtp_secret": "m3-live-harness"`: the PLACEHOLDER password that module 3's
# account-creation route requires for the SMTP sink in the harness (Mailpit runs with MP_SMTP_AUTH_ACCEPT_ANY, so any value is accepted and nothing is protected by it; it exists only inside a private,
# `internal: true` Docker network that lives for one CI run). `generic-api-key` flags it because the key name says "secret" and the value has entropy 3.5.
# Read in full on 2026-11-16: it is the ONLY finding of the whole history (68 commits), and the commit holds no other.
#
# Why an allowlist and not a history rewrite or a .gitleaksignore line: the owner's rules for this phase forbid GitHub deletions (a force-push drops commits), and .gitleaksignore must stay EMPTY (a gate
# fails on any entry). Why this is not a hole: the allowlist names one immutable commit, so nothing added later is covered by it; it targets one rule, so every other rule still runs on that commit; and
# scripts/check-gitleaks-config.sh (workflow `gates`) fails on any other shape of exception and on a commit that is not in this repository's history.
[[allowlists]]
description = "placeholder SMTP-sink password in the harness's live module-3 test (commit 355299a6): not a secret"
targetRules = ["generic-api-key"]
commits = ["355299a6c605a2ca0601bf58afb0e0468d7fccb0"]

# The THIRD exception (Phase 2): ONE rule, ONE commit, the same false positive quoted in prose.
# Commit 7b05c78367ed7c7799628c07d8ed5342eb5a3bdf is the spec commit that QUOTED the placeholder above (Docs/phase-2-spec.md, open decision 15) in a key-and-value form that matches generic-api-key again.
# The quoting was removed in the next commit; the commit itself is in history and cannot be removed without a force-push. It is the only finding of that commit (read in full on 2026-11-16).
[[allowlists]]
description = "the placeholder SMTP-sink password quoted in the Phase 2 spec text (commit 7b05c78): not a secret"
targetRules = ["generic-api-key"]
commits = ["7b05c78367ed7c7799628c07d8ed5342eb5a3bdf"]

# The FOURTH exception (Phase 3): ONE rule, ONE commit, a selftest fixture.
# Commit 8accb189b1c1a9146445c8bf4b9705befb80c854 added tests/harness/m2worker/stage-selftest.sh, whose line 85 sets the shell variables M2_ADMIN_KEY, M2_WORKER_TOKEN, M2_TOKEN and SINK_PASS to
# invented values (`opkey-0123456789abcdef` and the like) so that the selftest can prove the secret-leak scan of the harness finds them in a fake log: they are made-up strings written in the
# script, they were never a credential of anything, and the harness mints its real ones at run time. `generic-api-key` flags the line (the name says KEY, the value has entropy). The next commit
# replaces the values with low-entropy ones; this commit is in published history and cannot be rewritten (no history rewrites). It is the only finding of that commit (read in full on 2026-11-17).
[[allowlists]]
description = "invented credential-shaped values in the m2worker stage selftest fixture (commit 8accb18): not secrets"
targetRules = ["generic-api-key"]
commits = ["8accb189b1c1a9146445c8bf4b9705befb80c854"]

# The FIFTH exception (Phase 3): ONE rule, ONE commit, a test assertion.
# Commit 56eb8ab26d7ac8edfbeb5dcb1afe09919ce10053 added internal/contractcheck/assert_test.go, whose line 43 lists the expected failure kinds of the drift checker ("kind=KeyMissing", "kind=ShapeViolation", ...) in one
# string slice: ordinary identifiers of the package, flagged by `generic-api-key` only because the line mixes quoted words with "key" in them and has some entropy. It is the only finding of that commit (read in
# full on 2026-11-18, `gitleaks detect` over bec9b8c..70df561 reports exactly this one). The next commit builds the list from a helper so the line no longer exists; this commit is in published history and cannot be
# rewritten (no history rewrites).
[[allowlists]]
description = "failure-kind identifiers of the drift checker's assertion test (commit 56eb8ab): not secrets"
targetRules = ["generic-api-key"]
commits = ["56eb8ab26d7ac8edfbeb5dcb1afe09919ce10053"]

# Phase 4, chunk B14a: internal/config/config_test.go in commit 114b9e7 has a table of INVALID values for the JWT dial; one of them, a deliberately too-short secret (the row that expects the refusal "at least 32 bytes"), is flagged by
# `generic-api-key` because the line names a secret and carries a quoted word with some entropy. It is not a secret: it is the value the test proves the service REFUSES. It is the only finding of the history at that
# commit (read in full on 2026-11-25 with gitleaks 8.30.1 -v --redact). The line is still in the file (a scan reads what each commit ADDS, so later commits that leave it alone raise nothing); this commit is in published history and cannot be rewritten
# (no history rewrites, no GitHub deletions).
[[allowlists]]
description = "a deliberately too-short secret in the JWT dial validation test (commit 114b9e7): the value the service refuses, not a secret"
targetRules = ["generic-api-key"]
commits = ["114b9e7a51cf1d6ab7381f4b7c4cf4a9678a0b66"]
