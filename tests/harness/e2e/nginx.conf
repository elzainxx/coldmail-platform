# The e2e scope's TLS edge (tests/harness/docker-compose.e2e.yml, service e2e-edge; stage tests/harness/e2e/stage.sh).
#
# WHY IT EXISTS. The platform refuses a public address that is not https (PLATFORM_PUBLIC_BASE_URL, so that every unsubscribe link of a message is https), and a page served over https may not call
# a Supabase Auth that answers over plain http (mixed content). The production code is NOT changed to get around either: this sidecar terminates TLS, with a certificate the stage makes for the run
# (self-signed, two names, thrown away with the run), and hands the plain request to the one service behind each name. The browser of the scope (Playwright's Chromium, ignoreHTTPSErrors) trusts it
# by being told to ignore the certificate; nothing outside the private network ever sees it.
#
# TWO NAMES, one certificate, both resolved by Docker's DNS on the private network (aliases of this container):
#   app.harness.test   the platform: the built web app, /config.json, /v1/..., /u/<token>, /readyz  (one origin: decision 1 of Docs/phase-6-spec.md)
#   auth.harness.test  GoTrue, at the path a hosted Supabase project serves it at: /auth/v1/...  (the `/auth/v1` is taken off before GoTrue sees the request, GoTrue serves its API at its root)
# The two names are written in four places that the selftest holds equal: here, the certificate's subject alternative names (stage.sh), the aliases of the compose file and the addresses the
# platform and the browser are given.
#
# RUNS AS A NON-ROOT USER with a read-only file system: every path nginx would write to is under /tmp (a tmpfs), the port is 443 through the namespaced sysctl net.ipv4.ip_unprivileged_port_start=0 of the
# compose file (the same way the fixture DNS binds 53), and the key is read with the uid of the run's user (the stage writes it mode 600). NO access log: a request line holds an invite token or an
# unsubscribe token, and the logs of a failed run are public.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }

http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  # a CSV upload is streamed to the platform (decision 6: the platform's own limit is the one that counts)
  client_max_body_size 64m;
  proxy_http_version 1.1;
  proxy_request_buffering on;
  proxy_read_timeout 120s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;

  ssl_certificate /tls/tls.crt;
  ssl_certificate_key /tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # the stage's and the container's health check: plain http on a second port, inside the private network only; it answers without asking any upstream
  server {
    listen 8081;
    server_name _;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
  }

  server {
    listen 443 ssl;
    server_name app.harness.test;
    location / { proxy_pass http://e2e-platform:8080; }
  }

  server {
    listen 443 ssl;
    server_name auth.harness.test;
    # the prefix of a hosted project (https://<ref>.supabase.co/auth/v1/...) is taken off: the trailing slash of proxy_pass replaces the matched location
    location /auth/v1/ { proxy_pass http://gotrue:9999/; }
    location / { default_type text/plain; return 404 "this name serves GoTrue under /auth/v1/ only\n"; }
  }
}
