# The senders' crash matrix and real outages (Phase 4 close-out D5 and D6): a compose override file that run.sh merges AFTER docker-compose.yml, docker-compose.m2worker.yml and docker-compose.jobs.yml
# (`-f ... -f docker-compose.sendjobs.yml`) ONLY when the stage is on: under H_SCOPE=sendjobs, sendjobs-m2 or sendjobs-m3, or in the full run once `sendjobs` (with `jobs`) is named in FULL_INCLUDES (run.sh, one
# place). In every other run this file is not read at all.
#
# WHAT IS HERE: nothing new is built and no service is added. The two platform instances of the jobs overlay (jobs-a, jobs-b: the job engine ON, the fault points armed by name) are ALSO given module 2's and
# module 3's addresses and service tokens (the platform reads PLATFORM_M2_URL with PLATFORM_M2_SERVICE_TOKEN and PLATFORM_M3_URL with PLATFORM_M3_SERVICE_TOKEN; PLATFORM_M3_URL and the operator key
# PLATFORM_M3_ADMIN_TOKEN, which the entitlement loops use, are already in the jobs overlay) and the staleness limit of both senders at its minimum (one minute: the outage proof waits for the `stale`
# event). The tick, the settle interval and the backoff cap are the jobs overlay's (200 ms, 1 s, 2 s). The scenario program's container is given what it needs to make a user ready to send and to read what a
# send left behind: each module's URL, service token and operator key (three credentials of each module, minted per run by run.sh stage 2 and m2w_mint, never printed), the controllable sink's control
# API and the SMTP password the accounts use (the sink accepts any credential).
#
# THE UNSUBSCRIBE LINK (Phase 5). The platform REFUSES to confirm a send job without a link maker (PLATFORM_UNSUBSCRIBE_SECRET of at least 32 bytes and an https PLATFORM_PUBLIC_BASE_URL), and writes no
# module-facing item without one: every send scope would break. Both instances are given the two dials here, and the scenario program the SAME two values, because it makes each item's link itself with the
# platform's own code (internal/unsubscribe) to compute the message every recipient must have received (tests/harness/jobscenario/send_render.go). The secret is DEDICATED to this scope: minted per run by
# sj_mint (tests/harness/jobs/send-stage.sh) as H_SJ_UNSUBSCRIBE_SECRET, 32 random bytes in hex, masked, mode 600, never printed. It REPLACES the value the jobs overlay lends its instances (the module-1 key-derivation
# secret: the `jobs` scope confirms no send job), so the two secrets of this scope are never one value. The public address is a fixed documentation name (.test, RFC 2606): no request is ever made to it, it
# only appears in the links of the messages (an anchor, so that the instances and the scenario program cannot be given two).
#
# Keep jobs-b in step with jobs-a. NO port is published here (the exposure check lists the services; docker inspect is the second instrument).

x-sj-public-base: &sj-public-base "https://platform.example.test"

services:
  jobs-a:
    environment:
      PLATFORM_M2_URL: http://m2:8080
      PLATFORM_M2_SERVICE_TOKEN: ${H_M2_TOKEN:?}
      PLATFORM_M3_SERVICE_TOKEN: ${H_M3_TOKEN:?}
      PLATFORM_JOB_STALE_AFTER_MIN_M2: "1"
      PLATFORM_JOB_STALE_AFTER_MIN_M3: "1"
      PLATFORM_UNSUBSCRIBE_SECRET: ${H_SJ_UNSUBSCRIBE_SECRET:?}
      PLATFORM_PUBLIC_BASE_URL: *sj-public-base

  jobs-b:
    environment:
      PLATFORM_M2_URL: http://m2:8080
      PLATFORM_M2_SERVICE_TOKEN: ${H_M2_TOKEN:?}
      PLATFORM_M3_SERVICE_TOKEN: ${H_M3_TOKEN:?}
      PLATFORM_JOB_STALE_AFTER_MIN_M2: "1"
      PLATFORM_JOB_STALE_AFTER_MIN_M3: "1"
      PLATFORM_UNSUBSCRIBE_SECRET: ${H_SJ_UNSUBSCRIBE_SECRET:?}
      PLATFORM_PUBLIC_BASE_URL: *sj-public-base

  jobscenario:
    environment:
      SENDJOBS_M2_URL: http://m2:8080
      SENDJOBS_M2_TOKEN: ${H_M2_TOKEN:?}
      SENDJOBS_M2_ADMIN_KEY: ${H_M2_ADMIN_KEY:?}
      SENDJOBS_M3_URL: http://m3:8080
      SENDJOBS_M3_TOKEN: ${H_M3_TOKEN:?}
      SENDJOBS_M3_ADMIN_KEY: ${H_M3_ADMIN_KEY:?}
      SENDJOBS_CTL_URL: http://smtp-ctl:8025
      SENDJOBS_SINK_PASSWORD: ${H_SINK_PASSWORD:?}
      SENDJOBS_UNSUBSCRIBE_SECRET: ${H_SJ_UNSUBSCRIBE_SECRET:?}
      SENDJOBS_PUBLIC_BASE_URL: *sj-public-base
