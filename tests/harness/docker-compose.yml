# The platform harness stack: ONE real Postgres, the three module Controls built from the PINNED checkouts (tools/modules.lock), and the platform itself, all on a
# Docker network that is `internal: true` and publishes NO port to the host. Run by tests/harness/run.sh on a GitHub runner; every H_* variable comes from the env-file
# run.sh writes (secrets are minted per run and never committed).
#
# What is real here: the digest-pinned supabase/postgres image (the database a real install runs on: its own auth schema, roles and non-superuser migrating role) with the required
# provisioning step applied; each module's own migration tool and Control image built from its unmodified pinned source; the platform's own migrator and service. What is NOT here, on
# purpose: Supabase's GoTrue, pooler and PostgREST, CoreDNS, and (until Phase 2 chunk B8) the workers and the SMTP sink — the list is printed by run.sh on every run.
#
# No service sets `image:` for something it builds (the digest-pin gate reads every `image:` as a registry reference). The platform image is built once per service that
# runs it; that costs a minute of CI time and keeps the compose file free of unpinned names.
#
# Ordering is done by run.sh (one-shot services are run with `docker compose run`, then the long-running ones are started with `up --wait`), so the long-running
# services depend only on a healthy Postgres: a `service_completed_successfully` dependency on a container that `run --rm` already removed would start it a second time.
name: coldmail-platform-harness

networks:
  private:
    internal: true      # no route to the outside; nothing in the stack needs one at runtime (images are built before `up`)


x-platform-build: &platform-build
  context: "${H_PLATFORM_DIR:?}"
  dockerfile: Dockerfile

services:
  # THE DATABASE IS THE IMAGE A REAL INSTALL RUNS ON (Phase 2, ruling OD-7): the digest-pinned supabase/postgres, with its own `auth` schema, its roles (anon, authenticated, service_role,
  # supabase_admin ...) and its non-superuser migrating role `postgres`. Every migrator below connects as `postgres`, exactly as an install does, after the required provisioning step
  # (db/install/preprovision.sql, service `preprovision`). The integration tests need a SUPERUSER connection for scratch databases and for proving that a refusal bites: that is the image's
  # own superuser `supabase_admin` (same password; measured by tests/supabase/run.sh), never `postgres`. The database is `postgres`, as on a Supabase project.
  # No `command:` override: the image's entrypoint passes its own config_file, and replacing the command would drop it. (The Phase 1 harness ran `-c fsync=off` on the official image; this one keeps durability on.)
  # NOT a tmpfs: the outage check stops and restarts this container, and a tmpfs is discarded on stop (the restarted database would have no roles). The data lives in the container's writable layer,
  # which survives stop/start and is removed by `down -v`.
  postgres:
    image: supabase/postgres:17.12.0.000@sha256:8630950b489ecc70563300180287a98c192a4a48f5ae00b4febdaeea1abe85de
    environment:
      POSTGRES_PASSWORD: ${H_PG_SUPERPASS:?}
    # the image runs its init scripts (roles, the auth schema, extensions) on first start and only then listens on TCP: allow it a generous window
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 90
      start_period: 20s
    networks: [private]

  # ── one-shot jobs (run with `docker compose run --rm <name>`) ─────────────────────────────────────────────────────────────────────────────────────────────────────
  # The REQUIRED provisioning step of an install (Docs/install.md step 2), run as the migrating role `postgres` BEFORE any chain: it lets that role create objects as the module-owner roles of
  # modules 2 and 3 (their own bootstraps cannot do it as shipped; tests/supabase measures the failure without this step). Uses a postgres client image only for psql.
  preprovision:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment: { PGPASSWORD: "${H_PG_SUPERPASS:?}" }
    volumes:
      - ${H_PLATFORM_DIR:?}/db/install/preprovision.sql:/preprovision.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "postgres", "-d", "postgres", "-f", "/preprovision.sql"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
    restart: "no"

  migrate-platform:
    build: *platform-build
    entrypoint: ["/usr/local/bin/platform-migrate"]
    command: ["up-and-set-password"]
    environment:
      PLATFORM_MIGRATE_DATABASE_URL: postgres://postgres:${H_PG_SUPERPASS:?}@postgres:5432/postgres
      PLATFORM_MIGRATIONS_DIR: /db/migrations
      PLATFORM_APP_PASSWORD: ${H_PLATFORM_APP_PASSWORD:?}
    volumes:
      - ${H_PLATFORM_DIR:?}/db:/db:ro
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
    restart: "no"

  # Module 1's own migration runner (cmd/migrate, built from the pinned source into the image the platform supplies for it: tests/harness/m1/Dockerfile): every file once, in order, recorded in
  # verify.schema_migrations. run.sh runs this service TWICE: the second run must be a no-op (the ruling "running the full chain twice must be a no-op"). As `postgres`, like an install.
  migrate-m1:
    build: { context: "${H_MODULES_ROOT:?}/coldmail-verify", dockerfile: "${H_PLATFORM_DIR:?}/tests/harness/m1/Dockerfile" }
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      TM_MIGRATE_DATABASE_URL: postgres://postgres:${H_PG_SUPERPASS:?}@postgres:5432/postgres
      TM_MIGRATIONS_DIR: /migrations
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
    restart: "no"

  # verify_app is created by migration 0016 as a LOGIN role without a password; the password is set out of band, never in SQL (psql interpolates :'pw' from stdin)
  migrate-m1-password:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment: { PGPASSWORD: "${H_PG_SUPERPASS:?}", M1_APP_PASSWORD: "${H_M1_APP_PASSWORD:?}" }
    entrypoint: ["sh", "-ec"]
    command:
      - |
        printf "ALTER ROLE verify_app PASSWORD :'pw';\n" | psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d postgres -q -v "pw=$$M1_APP_PASSWORD" >/dev/null
        echo "migrate-m1-password: verify_app password set"
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
    restart: "no"

  migrate-m2:
    build: { context: "${H_MODULES_ROOT:?}/coldmail-send-managed", dockerfile: tools/send-managed-migrate/Dockerfile }
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:${H_PG_SUPERPASS:?}@postgres:5432/postgres
      MIGRATIONS_DIR: /db/migrations
      PREFLIGHT_SQL: /db/preflight/check_platform_tables.sql
      SEND_MANAGED_MODULE_PASSWORD: ${H_M2_APP_PASSWORD:?}
    volumes:
      - ${H_MODULES_ROOT:?}/coldmail-send-managed/db:/db:ro
    command: ["up-and-set-password"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
    restart: "no"

  migrate-m3:
    build: { context: "${H_MODULES_ROOT:?}/coldmail-send-byo", dockerfile: tools/send-byo-migrate/Dockerfile }
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:${H_PG_SUPERPASS:?}@postgres:5432/postgres
      MIGRATIONS_DIR: /db/migrations
      PREFLIGHT_SQL: /db/preflight/check_platform_tables.sql
      SEND_BYO_MODULE_PASSWORD: ${H_M3_APP_PASSWORD:?}
    volumes:
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/db:/db:ro
    command: ["up-and-set-password"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
    restart: "no"

  # ── the three modules (long-running; no `ports:` anywhere — that is what the exposure check asserts) ───────────────────────────────────────────────────────────────
  m1:
    # Module 1 ships no Dockerfile for its control plane: this one is the platform's (tests/harness/m1/Dockerfile) and builds the pinned source unmodified.
    build: { context: "${H_MODULES_ROOT:?}/coldmail-verify", dockerfile: "${H_PLATFORM_DIR:?}/tests/harness/m1/Dockerfile" }
    environment:
      # Module 1 connects as verify_app, a plain LOGIN role that owns nothing (its migration 0016 gives it exactly the grants the code needs; Docs/phase-1-spec.md A2). It used to need a superuser (Phase 0 F3).
      TM_DATABASE_URL: postgres://verify_app:${H_M1_APP_PASSWORD:?}@postgres:5432/postgres
      TM_PEPPER: ${H_M1_PEPPER:?}
      TM_QUEUE_ADDR_KEY: ${H_M1_QUEUE_KEY:?}      # without it the bulk and job routes answer 503 `unavailable` even to an authenticated caller (module 1: main.go, api.go)
      TM_ENV: development
      TM_LISTEN_ADDR: ":8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]

  m2:
    build: { context: "${H_MODULES_ROOT:?}/coldmail-send-managed", dockerfile: services/control/Dockerfile }
    environment:
      DATABASE_URL: postgres://send_managed_app:${H_M2_APP_PASSWORD:?}@postgres:5432/postgres
      CONTROL_SINGLETON_ACQUIRE_TIMEOUT_SEC: "60"
      CONTROL_HEALTH_ADDR: ":8080"
      CONTROL_WORKERLINK_ADDR: ":8443"
      CONTROL_WORKERLINK_STREAM_ADDR: ":8444"
      KMS_DEV_KEY_FILE: /secrets/kms/dev-master.key
      MTLS_SERVER_CERT: /secrets/mtls/control.crt
      MTLS_SERVER_KEY: /secrets/mtls/control.key
      MTLS_CA_CERT: /secrets/mtls/ca.crt
      CREDENTIAL_KEY_ID: cred-dek-v1
      PLATFORM_TOKEN_HASHES: ${H_M2_TOKEN_HASH:?}
    volumes:
      - ${H_MODULES_ROOT:?}/coldmail-send-managed/secrets/dev/kms/dev-master.key:/secrets/kms/dev-master.key:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-managed/secrets/dev/certs/control.crt:/secrets/mtls/control.crt:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-managed/secrets/dev/certs/control.key:/secrets/mtls/control.key:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-managed/secrets/dev/certs/ca.crt:/secrets/mtls/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 90s        # the module's own constraint: SIGTERM must be allowed to drain (module 2's docker-compose.yml)
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]

  m3:
    build: { context: "${H_MODULES_ROOT:?}/coldmail-send-byo", dockerfile: services/control/Dockerfile }
    environment:
      DATABASE_URL: postgres://send_byo_app:${H_M3_APP_PASSWORD:?}@postgres:5432/postgres
      CONTROL_SINGLETON_ACQUIRE_TIMEOUT_SEC: "60"
      CONTROL_HEALTH_ADDR: ":8080"
      CONTROL_WORKERLINK_ADDR: ":8443"
      CONTROL_WORKERLINK_STREAM_ADDR: ":8444"
      KMS_DEV_KEY_FILE: /secrets/kms/dev-master.key
      MTLS_SERVER_CERT: /secrets/mtls/control.crt
      MTLS_SERVER_KEY: /secrets/mtls/control.key
      MTLS_CA_CERT: /secrets/mtls/ca.crt
      CREDENTIAL_KEY_ID: cred-dek-v1
      PLATFORM_TOKEN_HASHES: ${H_M3_TOKEN_HASH:?}
      ADMIN_API_KEY_HASHES: ${H_M3_ADMIN_KEY_HASH:?}      # module 3 operator surface (the per-user suspend route) is mounted only when this is set: a credential DISTINCT from the service token
    volumes:
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/kms/dev-master.key:/secrets/kms/dev-master.key:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/control.crt:/secrets/mtls/control.crt:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/control.key:/secrets/mtls/control.key:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/ca.crt:/secrets/mtls/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 90s
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]

  # ── module 3's worker and the SMTP sink (Phase 2, chunk B8): module 3 must really SEND for the entitlement proofs to mean anything ────────────────────────────────────
  # The worker registers over mTLS with a token whose bcrypt hash run.sh seeds into send_byo.boxes BEFORE it starts (a worker that is rejected exits). It is started by name (run.sh stage 5b), not by
  # the `up --wait` of the three Controls. The sink MUST be named `smtp-sink`: the worker skips TLS validation only for that host name and private addresses (module 3 services/worker/src/smtp.js:136-145).
  m3-worker:
    build: { context: "${H_MODULES_ROOT:?}/coldmail-send-byo", dockerfile: services/worker/Dockerfile }
    environment:
      CONTROL_HOST: m3
      CONTROL_WORKERLINK_PORT: "8443"
      CONTROL_STREAM_PORT: "8444"
      CONTROL_SERVER_NAME: control          # the Control certificate's name (SAN DNS:control); the dial uses the host m3 and this name separately
      WORKER_ID: ${H_M3_WORKER_ID:?}
      WORKER_TOKEN: ${H_M3_WORKER_TOKEN:?}
      WORKER_HEARTBEAT_INTERVAL_SEC: "10"
      WORKER_SMTP_TIMEOUT_MS: "30000"
      MTLS_CLIENT_CERT: /secrets/mtls/worker.crt
      MTLS_CLIENT_KEY: /secrets/mtls/worker.key
      MTLS_CA_CERT: /secrets/mtls/ca.crt
    volumes:
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/worker.crt:/secrets/mtls/worker.crt:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/worker.key:/secrets/mtls/worker.key:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/ca.crt:/secrets/mtls/ca.crt:ro
    depends_on: { m3: { condition: service_healthy } }
    networks: [private]
    restart: "no"

  smtp-sink:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "false"
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"       # module 3's own harness sink: any credential is accepted, only the success path is exercised
      MP_SMTP_TLS_CERT: /certs/sink.crt
      MP_SMTP_TLS_KEY: /certs/sink.key
    volumes:
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/sink.crt:/certs/sink.crt:ro
      - ${H_MODULES_ROOT:?}/coldmail-send-byo/secrets/dev/certs/sink.key:/certs/sink.key:ro
    networks: [private]

  # ── the platform ────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  platform:
    build: *platform-build
    environment:
      PLATFORM_DATABASE_URL: postgres://platform_app:${H_PLATFORM_APP_PASSWORD:?}@postgres:5432/postgres
      PLATFORM_HTTP_ADDR: ":8080"
      PLATFORM_ENV: development
      PLATFORM_LOG_LEVEL: debug
      # Module 3's control and its OPERATOR (admin) key, a different credential from the service token above: the entitlement loops suspend and resume users through its admin route.
      PLATFORM_M3_URL: http://m3:8080
      PLATFORM_M3_ADMIN_TOKEN: ${H_M3_ADMIN_KEY:?}
      PLATFORM_ENTITLEMENT_EXPIRE_INTERVAL_SEC: "2"      # CI only: short loops so the proofs finish in seconds (production defaults are 30 and 5)
      PLATFORM_M3_RECONCILE_INTERVAL_SEC: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]

  # ── the callers, run INSIDE the private network (profiles: only started by name) ──────────────────────────────────────────────────────────────────────────────────
  probe:
    profiles: [probe]
    build: *platform-build
    entrypoint: ["/usr/local/bin/platform-probe"]
    environment:
      PROBE_PLATFORM_URL: http://platform:8080
      PROBE_M1_URL: http://m1:8080
      PROBE_M1_KEY: ${H_M1_CALLER_KEY:?}
      PROBE_M2_URL: http://m2:8080
      PROBE_M2_TOKEN: ${H_M2_TOKEN:?}
      PROBE_M3_URL: http://m3:8080
      PROBE_M3_TOKEN: ${H_M3_TOKEN:?}
      PROBE_MIN_CHECKS: "42"       # a healthy run executes 42 checks; the default floor (25) would let a whole module's 16 checks vanish unnoticed
    networks: [private]
    restart: "no"

  # The integration tests (tests/harness, build tag `harness`) are compiled on the runner with `go test -c` into a static binary and run here, so they reach the
  # database over the private network and nothing needs a published port.
  harness-tests:
    profiles: [tests]
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: ["/h/harness.test"]
    working_dir: /repo
    environment:
      HARNESS_ADMIN_DATABASE_URL: postgres://supabase_admin:${H_PG_SUPERPASS:?}@postgres:5432/postgres
      HARNESS_ADMIN_DATABASE_HOST_URL: postgres://supabase_admin:${H_PG_SUPERPASS:?}@postgres:5432/postgres
      HARNESS_PLATFORM_APP_PASSWORD: ${H_PLATFORM_APP_PASSWORD:?}
      HARNESS_MIGRATE_BIN: /h/platform-migrate
      HARNESS_REPO_ROOT: /repo
      HARNESS_MODULES_ROOT: /modules
      HARNESS_M3_URL: http://m3:8080
      HARNESS_M3_TOKEN: ${H_M3_TOKEN:?}
      HARNESS_M3_ADMIN_KEY: ${H_M3_ADMIN_KEY:?}
      HARNESS_SINK_URL: http://smtp-sink:8025
    volumes:
      - ${H_WORK:?}/out:/h:ro
      - ${H_PLATFORM_DIR:?}:/repo:ro
      - ${H_MODULES_ROOT:?}:/modules:ro
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
    restart: "no"
