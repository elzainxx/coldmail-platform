# The fault proofs: for every gate that is new or changed in a phase, the proof that it goes RED, for the reason it names, when a fault is introduced.
#
# THE MECHANISM. A fault is a PATCH, ci/faults/<phase>/<gate>.patch (`git diff --binary`, paths relative to the root of the thing patched), beside
# ci/faults/<phase>/<gate>.expect (the gate command, the setup it needs, and the message it must print; format in ci/faults/README.md). No fault is ever committed to a
# branch: a fault branch would put the fault in the history that gitleaks scans, and a fault that needs a token-shaped string is GENERATED by its leg, never stored.
# This workflow is dispatch-only. Job `plan` lists ci/faults/<phase>/*.expect and fails when there are none (or fewer than `min_legs`). Job `leg` runs one matrix leg
# per .expect: `ci/faults/run-leg.sh <phase> <gate>` makes two pristine `git archive HEAD` copies and passes ONLY IF
#   (1) the gate command exits 0 on the UNPATCHED copy (the paired control),   (2) the patch applies to a pristine copy,
#   (3) the setup steps still succeed on the PATCHED copy (otherwise the red would be for the wrong reason),
#   (4) the gate command exits non-zero on the patched copy and its output contains every MESSAGE line.
# Anything else fails the leg with a sentence naming the condition. Job `summary` is red unless every leg succeeded; a skipped matrix is a failure, not a pass.
# The run URL of a green dispatch is what the phase spec records as the evidence for the phase's gates.
#
# scripts/check-fault-patches.sh (workflow `gates`, every push) keeps a patch from rotting unseen between dispatches: it checks that each platform patch still applies.
# Legs need only a service Postgres (the digest the harness pins) and Go. A leg whose subject is module source fetches the three modules at the pins of tools/modules.lock
# with the read-only deploy keys, exactly as the harness does; there is no skip path (a missing key turns that leg red).
#
# TRIGGERS AND CONCURRENCY (the public-release pass): dispatch-only, and it STAYS dispatch-only: no push, pull_request or schedule trigger, no path filter. It deliberately has NO `concurrency:` block: a leg
# is a long, expensive proof whose whole value is that it ran to its verdict, so a second dispatch (or anything else) must never cancel one mid-run; two dispatches simply run side by side.
# (The per-leg modules are fetched exactly as in the harness: tools/fetch-modules.sh clones with each deploy key when supplied and anonymously when its variable is empty. ci/faults/run-leg.sh itself still
# demands the three keys, or FAULT_MODULES_DIR, for a leg whose subject is module source, and says so by name when they are missing.)
name: fault-proofs
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase directory under ci/faults/ to run (for example p1)'
        required: true
        default: 'p1'
        type: string
      only:
        description: 'Optional comma-separated gate names: run only those legs (for re-proving a leg whose message was wrong); every name must have an .expect'
        required: false
        default: ''
        type: string
      min_legs:
        description: 'Fail unless at least this many legs (.expect files) exist'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.list.outputs.gates }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: List the legs (red if there are none, or fewer than min_legs)
        id: list
        env:
          PHASE: ${{ inputs.phase }}
          MIN_LEGS: ${{ inputs.min_legs }}
          ONLY: ${{ inputs.only }}
        run: |
          set -u
          case "$PHASE" in ''|*[!a-z0-9_-]*) echo "::error::phase '$PHASE' must match [a-z0-9_-]+"; exit 1;; esac
          case "$MIN_LEGS" in ''|*[!0-9]*) echo "::error::min_legs '$MIN_LEGS' must be a whole number"; exit 1;; esac
          min=$((10#$MIN_LEGS))
          [ "$min" -ge 1 ] || { echo "::error::min_legs must be at least 1: a floor of 0 would let an empty phase pass"; exit 1; }
          dir="ci/faults/$PHASE"
          [ -d "$dir" ] || { echo "::error::$dir does not exist: found 0 legs, the instrument matched nothing"; exit 1; }
          json="["; n=0
          for f in "$dir"/*.expect; do
            [ -f "$f" ] || continue
            g="${f##*/}"; g="${g%.expect}"
            if [ -n "$ONLY" ]; then case ",$ONLY," in *",$g,"*) ;; *) continue;; esac; fi
            case "$g" in ''|[!a-z0-9]*|*[!a-z0-9_-]*) echo "::error::$f: the gate name '$g' must match [a-z0-9][a-z0-9_-]*"; exit 1;; esac
            [ "$n" -eq 0 ] || json="$json,"
            json="$json\"$g\""; n=$((n + 1))
          done
          if [ -n "$ONLY" ]; then want=$(printf '%s' "$ONLY" | awk -F, '{print NF}'); [ "$n" -eq "$want" ] || { echo "::error::only='$ONLY' names $want gate(s) but $n have an .expect in $dir"; exit 1; }; fi
          json="$json]"
          echo "legs found: $n (floor $min): $json"
          if [ "$n" -lt 1 ] || [ "$n" -lt "$min" ]; then
            echo "::error::found $n leg(s) in $dir, fewer than min_legs $min: the instrument matched nothing (or faults were deleted)"; exit 1
          fi
          echo "gates=$json" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"

  leg:
    needs: plan
    name: leg ${{ matrix.gate }}
    # The job reads secrets.DEPLOY_KEY_COLDMAIL_*, so it never runs for a pull request from a fork. The workflow is dispatch-only, so this is always true today; it is here so that a pull_request trigger
    # added later cannot hand a fork a job that sits beside the keys. (`summary` below reads a skipped matrix as a failure, so a skip could not read as green either.)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gates) }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEPLOY_KEY_COLDMAIL_VERIFY: ${{ secrets.DEPLOY_KEY_COLDMAIL_VERIFY }}
      DEPLOY_KEY_COLDMAIL_SEND_MANAGED: ${{ secrets.DEPLOY_KEY_COLDMAIL_SEND_MANAGED }}
      DEPLOY_KEY_COLDMAIL_SEND_BYO: ${{ secrets.DEPLOY_KEY_COLDMAIL_SEND_BYO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Toolchain (printed so a run says what it ran on)
        run: |
          go version
          psql --version
          git --version
          tar --version | head -n 1
          bash --version | head -n 1

      - name: The leg (control green, patch applies, setup survives, gate red with its message)
        env:
          PHASE: ${{ inputs.phase }}
          GATE: ${{ matrix.gate }}
        run: bash ci/faults/run-leg.sh "$PHASE" "$GATE"

  summary:
    needs: [plan, leg]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg must have passed (a skipped or cancelled matrix is a failure)
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LEG_RESULT: ${{ needs.leg.result }}
          LEG_COUNT: ${{ needs.plan.outputs.count }}
        run: |
          set -u
          if [ "$PLAN_RESULT" != success ] || [ "$LEG_RESULT" != success ]; then
            echo "::error::fault-proofs is RED: plan=$PLAN_RESULT legs=$LEG_RESULT (every leg must report success)"; exit 1
          fi
          echo "every leg passed: $LEG_COUNT legs"
