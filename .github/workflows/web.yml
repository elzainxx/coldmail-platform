# Web: type-check, build, tests, a check that Tailwind actually generated CSS, and the test-count floor — on a GitHub runner.
# `npm ci` from the committed lockfile, no npm cache (a green must not be earned from a stale artifact).
#
# WHEN IT RUNS (the trigger economy of the public-release pass): on a push or pull request that touches web/, the test-count floor it enforces (tests/floors-web.txt and
# scripts/check-test-floors.sh), or this file; and on dispatch. Nothing outside web/ is read by the type-check, the build, the CSS check or the tests. A push of a `v*` or `phase-*` tag always
# runs it (GitHub does not evaluate path filters for a tag push), so tagging a head puts a run of this workflow on that exact SHA. A newer run on the same ref
# cancels the older one.
name: web
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'phase-*'
    paths:
      - 'web/**'
      - 'tests/floors-web.txt'
      - 'scripts/check-test-floors.sh'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tests/floors-web.txt'
      - 'scripts/check-test-floors.sh'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: web/.node-version

      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Install from the lockfile
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: The built CSS contains the Tailwind utilities the page uses
        run: npm run check:css

      - name: Tests (JSON result captured for the floor gate)
        run: npm run test:json

      - name: Test-count floor
        working-directory: .
        run: bash scripts/check-test-floors.sh --floors tests/floors-web.txt --vitest-json web/test-results/vitest.json
