# The Supabase-shaped migration run: EVERY migration of the platform and of the three modules, run as the NON-superuser `postgres` against a digest-pinned supabase/postgres image,
# with every failed statement reported (file, line, SQLSTATE, the exact statement) and each pass red unless the set of real BLOCKERS equals its committed list.
#
# TWO LEGS, TWO CONTAINERS. `supabase-migrations` is a matrix of exactly two legs, and every leg has its OWN service container, so each pass starts from a pristine image database
# `postgres` (with the image's own auth schema, auth.users and extensions, which platform_0001 needs) and a pristine cluster: roles are no longer shared between the passes.
#   BASELINE  NO provisioning                                  -> compared with tests/supabase/baseline-blockers.txt  (what fails without the fix: the evidence that it is needed)
#   FIXED     db/install/preprovision.sql applied first    -> compared with tests/supabase/known-blockers.txt     (goal: empty). The proposed no-module-change fix: the migrator is
#             granted the module owner roles WITH INHERIT, SET before the module bootstraps run.
# Both legs migrate the database `postgres` as the role `postgres`. Why not two databases cloned in one container: the image's own background workers keep connections open on
# `postgres` that a non-superuser cannot terminate, so `CREATE DATABASE ... TEMPLATE postgres` fails ("being accessed by other users", measured on the runner); a fresh container per pass is
# the clean way to isolate the passes. Matrix legs run independently (`fail-fast: false`), so no `if:` is needed to make the second leg run when the first is red; the workflow is red when
# either leg is. public.users and public.job_items are the PLATFORM's (platform_0001); there is no module fixture.
#
# WHAT IT PROVES. On Supabase the migrating role `postgres` is not a superuser (the real superuser is `supabase_admin`), while the main harness runs stock Postgres with a superuser,
# so a migration that needs one (CREATE ROLE with attributes, ALTER ... OWNER TO a role the migrator cannot SET ROLE to, CREATE SCHEMA ... AUTHORIZATION, extensions,
# ALTER DEFAULT PRIVILEGES FOR ROLE, GRANT ... WITH ADMIN) has never been exercised. This job exercises them and states which ones fail, on the image the platform will really run on.
# It also proves its own instrument: the role is asserted to be a non-superuser, auth.users is asserted to exist, and a control file of known outcome is read through the real psql
# before any chain runs.
#
# WHAT IT DOES NOT PROVE (tests/supabase/run.sh prints the full list on every run): the pooler (Supavisor), Supabase Auth / GoTrue, PostgREST and the exposed schemas, a real project's
# RLS defaults, the extensions of the hosted service, a real project's role grants (they differ by project age), the runtime behaviour of any module (migrations only), and the
# modules' per-file transaction (psql runs each statement in autocommit, so one failure does not abort the rest of its file). It does not change a single migration.
#
# tools/fetch-modules.sh clones each module with its own READ-ONLY deploy key when the key is supplied, and anonymously over https when the key's variable is empty (the module
# repositories are public once published), at the commits tools/modules.lock pins. There is no skip path: a wrong or revoked key, or an empty key whose anonymous clone fails (the repository
# is still private), turns a leg red. The weekly schedule exists so a revoked key, or a moved image, shows up as a red run and not as silence.
# The password `ci` is a throwaway for a database that exists only for the duration of the job; it protects nothing.
#
# WHEN IT RUNS (the trigger economy of the public-release pass; two legs of up to 40 minutes each): on dispatch, on the weekly schedule, on a push of a version or phase tag (`v*`, `phase-*`; GitHub does not
# evaluate path filters for a tag push), and on a push to main or a pull request that touches something this job reads: db/ (the platform's migrations and the install step), tests/supabase/ (the
# runner, the classifier, the committed blocker lists), tools/modules.lock and tools/fetch-modules.sh (which module commits are migrated, and how they are fetched), and this file. It builds no Go
# and runs no platform test, so internal/, cmd/, the harness tests and go.mod are not in its set. A documentation-only push starts nothing here. A newer run on the same ref cancels the older one;
# the weekly scheduled run shares the default branch's group with a push to main, so a push that lands while it runs supersedes it (the newer run migrates the newer head).
#
# FORK PULL REQUESTS: the job reads secrets.DEPLOY_KEY_COLDMAIL_*, so it is skipped for a pull request from a fork (GitHub withholds secrets from a fork's run anyway, and a fork's code must not run
# beside them). This is the ONE `if:` in the file and tests/supabase/classify-selftest.sh pins its exact text and its place (the job, not a step or a leg): it skips BOTH legs together, and only for a fork pull
# request, so no leg can read as green by skipping. A job skipped by `if:` reports as SKIPPED, which branch protection counts as passing: if these checks are ever made REQUIRED, a fork pull request is not
# proven by them.
name: supabase
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'phase-*'
    paths:
      - 'db/**'
      - 'tests/supabase/**'
      - 'tools/modules.lock'
      - 'tools/fetch-modules.sh'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'tests/supabase/**'
      - 'tools/modules.lock'
      - 'tools/fetch-modules.sh'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
  schedule:
    - cron: '53 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-migrations:
    name: supabase-migrations (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BASELINE
            known: baseline-blockers.txt
            preprovision: ''
          - label: FIXED
            known: known-blockers.txt
            preprovision: db/install/preprovision.sql
    env:
      DEPLOY_KEY_COLDMAIL_VERIFY: ${{ secrets.DEPLOY_KEY_COLDMAIL_VERIFY }}
      DEPLOY_KEY_COLDMAIL_SEND_MANAGED: ${{ secrets.DEPLOY_KEY_COLDMAIL_SEND_MANAGED }}
      DEPLOY_KEY_COLDMAIL_SEND_BYO: ${{ secrets.DEPLOY_KEY_COLDMAIL_SEND_BYO }}
    services:
      postgres:
        image: supabase/postgres:17.12.0.000@sha256:8630950b489ecc70563300180287a98c192a4a48f5ae00b4febdaeea1abe85de
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        # the image runs its init scripts at first start (roles, the auth schema, extensions): allow several minutes before the job gives up on it
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 30s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: coldmail-platform
          fetch-depth: 0

      - name: Toolchain (printed so a run says what it ran on)
        run: psql --version

      - name: Selftest — the classifier reads psql's failure output, the known-blockers comparison goes red for the named reason on every way it can be wrong, run.sh's options, stage order and provisioning failure path are exercised with a fake psql, and this workflow's two-leg structure is asserted (no database)
        run: bash coldmail-platform/tests/supabase/classify-selftest.sh

      - name: Fetch the three modules at the commits tools/modules.lock pins (red if a key is missing or wrong, or a pin is unknown or unreachable)
        run: bash coldmail-platform/tools/fetch-modules.sh --lock coldmail-platform/tools/modules.lock "$GITHUB_WORKSPACE"

      - name: Pass ${{ matrix.label }} — every migration as the non-superuser postgres in database postgres of this leg's own container; blockers compared with tests/supabase/${{ matrix.known }}
        env:
          S_WORK: ${{ runner.temp }}/supabase-${{ matrix.label }}
          PASS_LABEL: ${{ matrix.label }}
          PASS_KNOWN: ${{ matrix.known }}
          PASS_PREPROVISION: ${{ matrix.preprovision }}
        run: |
          set -euo pipefail
          args=(--label "$PASS_LABEL"
                --dsn postgres://postgres:ci@localhost:5432/postgres
                --platform-dir coldmail-platform
                --modules-root "$GITHUB_WORKSPACE"
                --known "coldmail-platform/tests/supabase/$PASS_KNOWN")
          # the provisioning flag exists only for the leg whose matrix entry names a file (empty = none: the baseline)
          if [ -n "$PASS_PREPROVISION" ]; then args+=(--preprovision "coldmail-platform/$PASS_PREPROVISION"); fi
          bash coldmail-platform/tests/supabase/run.sh "${args[@]}"
