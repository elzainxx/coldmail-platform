# The real-infrastructure harness: one real Postgres, the THREE MODULES built from the commits tools/modules.lock pins and running as real services, and the platform
# itself, all on a Docker network that is internal and publishes no port. Then the integration tests, the end-to-end probe (platform -> each module's health, readiness
# and describe, with the service token), the exposure check and the outage check. See tests/harness/run.sh for the stages and for the list of what it does NOT check.
#
# tools/fetch-modules.sh clones each module with its own READ-ONLY deploy key when the key is supplied (the same three keys platform-check uses), and anonymously over https when the
# key's variable is empty (the module repositories are public once published; the script's selftest, run below, proves that route against local repositories). There is no skip path: a
# wrong or revoked key, or an empty key whose anonymous clone fails (the repository is still private), turns this job red (platform-check proves each of those ways). A weekly schedule
# exists so a key revoked while nobody pushes shows up as a red run and not as silence.
#
# Docker is down on the owner's machine: this workflow, on a GitHub runner, is the only admissible evidence that the harness works.
#
# WHEN IT RUNS (the trigger economy of the public-release pass; this is a ~20 minute job): on dispatch, on the weekly schedule, on a push of a version or phase tag (`v*`, `phase-*`; GitHub
# does not evaluate path filters for a tag push), and on a push to main or a pull request that touches something the harness reads: db/ (migrations, install step, module-reads files), internal/ and cmd/ (the
# platform it builds), tests/ (this harness, its compose file and the supabase tests), tools/modules.lock and the fetch script with its selftest (the pins and how they are fetched), go.mod / go.sum, the root
# Dockerfile (the platform image), the scripts run.sh calls (check-module-reads, check-public-schema + its listing query, check-test-floors, check-balance-invariant), and this file. A documentation-only
# push starts nothing here. A newer run on the same ref cancels the older one; the weekly scheduled run shares the default branch's group with a push to main, so a push that lands while it runs
# supersedes it (the newer run tests the newer head; a cancelled schedule run is not a missed week, the next one still comes). A run for a tag has its own group (the tag ref).
#
# FORK PULL REQUESTS: the job reads secrets.DEPLOY_KEY_COLDMAIL_*, so it is skipped for a pull request from a fork (GitHub withholds secrets from a fork's run anyway, and a fork's code must not run
# beside them). A job skipped by `if:` reports as SKIPPED, which branch protection counts as passing: if this check is ever made a REQUIRED status check, a fork pull request is not proven by it.
name: harness
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'phase-*'
    paths:
      - 'db/**'
      - 'internal/**'
      - 'cmd/**'
      - 'tests/**'
      - '!tests/license-canonical.txt'
      - '!tests/personal-details/**'
      - 'tools/modules.lock'
      - 'tools/fetch-modules.sh'
      - 'tools/fetch-modules-lock-selftest.sh'
      - 'scripts/check-module-reads.sh'
      - 'scripts/check-public-schema.sh'
      - 'scripts/public-schema-listing.sql'
      - 'scripts/check-test-floors.sh'
      - 'scripts/check-balance-invariant.sh'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile*'
      - '.github/workflows/harness.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'internal/**'
      - 'cmd/**'
      - 'tests/**'
      - '!tests/license-canonical.txt'
      - '!tests/personal-details/**'
      - 'tools/modules.lock'
      - 'tools/fetch-modules.sh'
      - 'tools/fetch-modules-lock-selftest.sh'
      - 'scripts/check-module-reads.sh'
      - 'scripts/check-public-schema.sh'
      - 'scripts/public-schema-listing.sql'
      - 'scripts/check-test-floors.sh'
      - 'scripts/check-balance-invariant.sh'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile*'
      - '.github/workflows/harness.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to run. full = every stage (the default, and what every other trigger runs); m1node = module 1 real verifier node; m2worker = Postgres + migrations + module 2 + its real worker + the controllable sink + only the TestM2Worker tests; gotrue = Postgres + migrations + a real, digest-pinned GoTrue + only the TestGoTrue tests (the platform''s token verification against tokens GoTrue issued); jobs = Postgres + migrations + module 1 with a fixture DNS + TWO platform instances with the job engine on: the platform''s own process killed at five injected points, the leader killed, module 1 stopped mid-job, every job verified (tests/harness/jobs/stage.sh); sendjobs = Postgres + migrations + modules 2 and 3 with their workers and the controllable sink + the platform instance with the job engine on: the platform''s own process killed at seven points of a send job, each sender stopped mid-job, nothing lost, nothing sent twice at the sink (tests/harness/jobs/send-stage.sh); sendjobs-m2 and sendjobs-m3 = the same for one sender; e2e = Postgres + migrations + a real GoTrue + modules 1, 2 and 3 with their workers and the sink + ONE platform instance serving the built web app and the API from one origin behind a TLS edge, and Playwright''s Chromium (a digest-pinned image) inside the private network running web/e2e/*.spec.ts: screenshots, traces and reports are uploaded as the e2e-artifacts artifact (tests/harness/e2e/stage.sh)'
        type: choice
        options:
          - full
          - m1node
          - m2worker
          - gotrue
          - jobs
          - sendjobs
          - sendjobs-m2
          - sendjobs-m3
          - e2e
        default: full
      contract_record:
        description: 'Record mode of the contract drift gate: the sessions PRINT the real responses as CONTRACT-FIXTURE blocks (the lead commits them as the fixtures) instead of failing on a difference. Leave off for every normal run.'
        type: boolean
        default: false
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      DEPLOY_KEY_COLDMAIL_VERIFY: ${{ secrets.DEPLOY_KEY_COLDMAIL_VERIFY }}
      DEPLOY_KEY_COLDMAIL_SEND_MANAGED: ${{ secrets.DEPLOY_KEY_COLDMAIL_SEND_MANAGED }}
      DEPLOY_KEY_COLDMAIL_SEND_BYO: ${{ secrets.DEPLOY_KEY_COLDMAIL_SEND_BYO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: coldmail-platform
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: coldmail-platform/go.mod
          cache: false

      - name: Toolchain (printed so a run says what it ran on)
        run: |
          go version
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          openssl version

      - name: Selftests that need neither keys nor Docker — the exposure check and the lock validation each go red for the reason they name
        run: |
          set -u
          rc=0
          for t in coldmail-platform/tests/harness/check-exposure-selftest.sh coldmail-platform/tools/fetch-modules-lock-selftest.sh; do
            echo "::group::$t"; bash "$t" || { echo "SELFTEST FAILED: $t"; rc=1; }; echo "::endgroup::"
          done
          exit $rc

      - name: Fetch the three modules at the commits tools/modules.lock pins (red if a key is missing or wrong, or a pin is unknown or unreachable)
        run: bash coldmail-platform/tools/fetch-modules.sh --lock coldmail-platform/tools/modules.lock "$GITHUB_WORKSPACE"

      - name: Control — the pin check goes red when a module is not at its pinned commit (and green again once it is restored)
        run: |
          set -u +e
          for m in coldmail-verify coldmail-send-managed coldmail-send-byo; do
            pin="$(git -C "$m" rev-parse HEAD)"
            git -C "$m" -c advice.detachedHead=false checkout -q --detach "$pin~1" || { echo "CONTROL SETUP FAILED: $m has no parent commit"; exit 1; }
            out="$(H_MODULES_ROOT="$GITHUB_WORKSPACE" bash coldmail-platform/tests/harness/run.sh --pins-only 2>&1)"; rc=$?
            printf '%s\n' "$out" | tail -4 | sed 's/^/    | /'
            git -C "$m" -c advice.detachedHead=false checkout -q --detach "$pin"
            [ "$rc" -ne 0 ] && printf '%s\n' "$out" | grep -q "$m is at .* but tools/modules.lock pins $pin" || { echo "CONTROL FAILED: the pin check did not go red for $m (rc=$rc)"; exit 1; }
            echo "  control holds: $m one commit behind its pin -> red, naming it"
          done
          H_MODULES_ROOT="$GITHUB_WORKSPACE" bash coldmail-platform/tests/harness/run.sh --pins-only || { echo "CONTROL FAILED: the pin check is red after restoring the pins"; exit 1; }

      # Scope e2e only: the web app is built ON THE RUNNER (npm ci, npm run build) and the platform serves it; web/package.json asks for Node 24 (the web workflow sets it up the same way). No other scope needs Node beyond the
      # exposure check's own, which the runner's default Node serves, so no other scope is given this step. `npm ci` downloads no browser: Playwright's Chromium is in the digest-pinned image the stage runs in.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.scope == 'e2e'
        with:
          node-version-file: coldmail-platform/web/.node-version

      - name: The harness
        env:
          H_MODULES_ROOT: ${{ github.workspace }}
          H_WORK: ${{ runner.temp }}/harness
          H_SCOPE: ${{ inputs.scope || 'full' }}      # only a dispatch carries the input; every other trigger runs the full harness
          H_CONTRACT_RECORD: ${{ inputs.contract_record && '1' || '' }}      # record mode of the contract drift gate (a dispatch with contract_record); empty on every other trigger
        run: bash coldmail-platform/tests/harness/run.sh

      # Scope e2e only, and whatever the harness step ended with (a red run is the one whose screenshots and traces matter): everything the browser run wrote under $H_WORK/e2e-artifacts, which the stage has already read for
      # the run's infrastructure secrets (it empties the directory on a hit, so nothing secret is uploaded). The traces of a failed test hold the TEST USERS' per-run passwords and tokens of a stack that is gone
      # when the run ends (web/e2e/README.md). 14 days. A repository's artifacts are as public as the repository: nothing of the infrastructure is in them.
      - name: The browser run's artifacts (screenshots, traces, the HTML report, results.json)
        if: ${{ always() && inputs.scope == 'e2e' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifacts
          path: ${{ runner.temp }}/harness/e2e-artifacts
          retention-days: 14
          if-no-files-found: warn
