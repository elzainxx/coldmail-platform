# The repository's own gates, and the proof that each of them can go red. Every gate script has a selftest whose reject cases must fail FOR THE
# REASON THEY NAME; the selftests run here on every push, and each gate then runs on the real repository.
#
#   check-test-floors   per-package test-count floor        (also run, on real logs, by the go and web workflows)
#   check-image-pins    every container image carries a digest, none is :latest
#   check-migrations    the migration naming / pairing / chain convention
#   check-gitleaksignore the secret scanner's ignore file holds no entries (fault proofs are patches now, not commits)
#   check-fault-patches  every ci/faults/<phase>/ fault proof parses and its platform patch still applies (the fault-proofs workflow is dispatch-only)
#   check-public-schema  schema public holds only the allowlisted platform tables (the selftest here; the live check runs in the harness)
#   run-leg              the fault-proof leg runner (ci/faults/run-leg.sh) passes only a good fault and fails, for the named reason, on every bad one
#
# NOT covered by this file: the secret scan (gitleaks.yml), the docs/citation checks (platform-check.yml), the Go/web builds (go.yml, web.yml)
# and the real-Postgres + real-module harness (harness.yml).
name: gates
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Selftests — each gate goes red, for the named reason, on each fault it exists to catch
        run: |
          set -u
          rc=0
          for t in scripts/check-test-floors-selftest.sh scripts/check-image-pins-selftest.sh scripts/check-migrations-selftest.sh scripts/check-gitleaksignore-selftest.sh scripts/check-fault-patches-selftest.sh ci/faults/run-leg-selftest.sh scripts/check-public-schema-selftest.sh; do
            echo "::group::$t"; bash "$t" || { echo "SELFTEST FAILED: $t"; rc=1; }; echo "::endgroup::"
          done
          exit $rc

      - name: check-migrations on the real chain (the lifecycle test must name the newest migration)
        run: bash scripts/check-migrations.sh --lifecycle-test tests/harness/migrate_lifecycle_test.go

      - name: check-image-pins on the real repository (Dockerfiles, compose files, workflows)
        run: bash scripts/check-image-pins.sh --min-refs 5 .

      - name: check-gitleaksignore on the real repository
        run: bash scripts/check-gitleaksignore.sh

      # enable when the first ci/faults/p1 fault lands (today the gate is red on purpose: "found 0 faults: the instrument matched nothing"):
      # - name: check-fault-patches on the real repository
      #   run: bash scripts/check-fault-patches.sh --min-faults 1
