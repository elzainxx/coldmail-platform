# The repository's own gates, and the proof that each of them can go red. Every gate script has a selftest whose reject cases must fail FOR THE
# REASON THEY NAME; the selftests run here on every push, and each gate then runs on the real repository.
#
#   check-test-floors   per-package test-count floor        (also run, on real logs, by the go and web workflows)
#   check-image-pins    every container image carries a digest, none is :latest
#   check-migrations    the migration naming / pairing / chain convention
#   check-gitleaksignore the secret scanner's ignore file holds no entries (fault proofs are patches now, not commits)
#   check-fault-patches  every ci/faults/<phase>/ fault proof parses and its platform patch still applies (the fault-proofs workflow is dispatch-only)
#   check-public-schema  schema public holds only the allowlisted platform tables (the selftest here; the live check runs in the harness)
#   check-module-reads   the declared module statements still appear in the pinned module sources, and no undeclared file references public.users / public.job_items (the selftest here; the live check runs in the harness)
#   check-balance-invariant  the balance_drift / reserve_overdrawn gate (the selftest here; the live check runs in the harness and in the fault legs)
#   check-user-lists     platform code never selects public.users directly: platform.listable_users is the only sanctioned user list (the selftest and the real run, both here)
#   check-install-doc    Docs/install.md names only what exists and CI runs the install step it documents (the selftest and the real run, both here)
#   check-gitleaks-config the secret scanner configuration (.gitleaks.toml) holds only decided, narrow exceptions: one rule each, a path under audit-scratch or one commit that exists (the selftest and the real run, both here)
#   check-charge-table   internal/charge/rules.psv equals the fenced charge table in Docs/phase-2-spec.md byte for byte and charges only seeded units (the selftest and the real run, both here)
#   check-license       LICENSE is the one paragraph in tests/license-canonical.txt byte for byte, NOTICE opens with the same two sentences, README carries the notice line, and neither LICENSE nor NOTICE says "confidential" (the selftest and the real run on this tree, both here; the three module checkouts are checked by platform-check, all five repositories by the parent's modules-lock)
#   check-personal-details no tracked text file names a Windows home path, a drive-letter path or an IPv4 address outside the allowed classes without an allowlist entry that says why (tests/personal-details/<repo>.allow; the selftest and the real run on this tree, both here)
#   check-verified-heads a status row may call a head done / CLOSED only when the required workflows (the heavy ones included) ran green on that exact SHA and the row cites the run (the selftest and the real run, both here; the real run asks the Actions API with the job token)
#   fetch-modules        tools/fetch-modules.sh refuses a bad lock and its anonymous route (a module whose deploy-key variable is empty) clones, checks out the pin and goes red for the reason it names (tools/fetch-modules-lock-selftest.sh; the harness workflow runs it too; local repositories, no network, no key)
#   run-leg              the fault-proof leg runner (ci/faults/run-leg.sh) passes only a good fault and fails, for the named reason, on every bad one
#
# NOT covered by this file: the secret scan (gitleaks.yml), the docs/citation checks (platform-check.yml), the Go/web builds (go.yml, web.yml)
# and the real-Postgres + real-module harness (harness.yml).
#
# WHEN IT RUNS (the trigger economy of the public-release pass): on EVERY push and pull request, with no path filter. Prose is deliberately NOT skipped: this workflow reads documents on purpose
# (check-install-doc reads Docs/install.md, check-charge-table reads Docs/phase-2-spec.md, check-fault-patches applies patches to both, check-verified-heads reads the status tables of the documents listed in
# tests/verified-heads-docs.txt, check-license reads LICENSE, NOTICE, README.md and tests/license-canonical.txt), so a documentation change must still run it. Docs/history/ is no longer ignored (it was, while
# no gate read it): check-personal-details reads EVERY tracked text file, Docs/history included, so a push that touches only Docs/history/ can add a Windows path or an address and must run the gates.
# No `paths` list and no `paths-ignore`: a new gate input can then never be skipped. A push of a `v*` or `phase-*` tag always runs it, so tagging a head puts a run of this workflow on that exact SHA.
# A newer run on the same ref cancels the older one.
name: gates
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'phase-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # The one job of this workflow needs one more READ permission than the file's default: check-verified-heads lists the workflow runs of a commit through the Actions API (the required workflows
    # having run on that exact SHA is what it asserts). `actions: read` is read-only; nothing here can write to the repository.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Selftests — each gate goes red, for the named reason, on each fault it exists to catch
        run: |
          set -u
          rc=0
          for t in scripts/check-test-floors-selftest.sh scripts/check-image-pins-selftest.sh scripts/check-migrations-selftest.sh scripts/check-gitleaksignore-selftest.sh scripts/check-fault-patches-selftest.sh ci/faults/run-leg-selftest.sh scripts/check-public-schema-selftest.sh scripts/check-module-reads-selftest.sh scripts/check-balance-invariant-selftest.sh scripts/check-user-lists-selftest.sh scripts/check-install-doc-selftest.sh scripts/check-gitleaks-config-selftest.sh scripts/check-charge-table-selftest.sh scripts/check-verified-heads-selftest.sh scripts/check-license-selftest.sh scripts/check-personal-details-selftest.sh tests/harness/m2worker/stage-selftest.sh tests/harness/m1node/stage-selftest.sh tests/harness/m3adapter/stage-selftest.sh tools/fetch-modules-lock-selftest.sh; do
            echo "::group::$t"; bash "$t" || { echo "SELFTEST FAILED: $t"; rc=1; }; echo "::endgroup::"
          done
          exit $rc

      - name: check-migrations on the real chain (the lifecycle test must name the newest migration)
        run: bash scripts/check-migrations.sh --lifecycle-test tests/harness/migrate_lifecycle_test.go

      - name: check-image-pins on the real repository (Dockerfiles, compose files, workflows)
        run: bash scripts/check-image-pins.sh --min-refs 5 .

      - name: check-gitleaksignore on the real repository
        run: bash scripts/check-gitleaksignore.sh

      - name: check-user-lists on the real repository (no platform code selects public.users except through platform.listable_users)
        run: bash scripts/check-user-lists.sh

      - name: check-install-doc on the real repository (Docs/install.md names only what exists, and CI runs the install step it documents)
        run: bash scripts/check-install-doc.sh

      - name: check-charge-table on the real repository (internal/charge/rules.psv equals the fenced table in the spec, and charges only seeded units)
        run: bash scripts/check-charge-table.sh

      - name: check-gitleaks-config on the real repository (the secret scanner's configuration holds only the decided, narrow exceptions)
        run: bash scripts/check-gitleaks-config.sh

      - name: check-fault-patches on the real repository (every ci/faults fault parses; every platform patch still applies)
        run: bash scripts/check-fault-patches.sh --min-faults 1

      - name: check-license on the real repository (LICENSE is the canonical paragraph, NOTICE and README say the same, nothing is called confidential)
        run: bash scripts/check-license.sh --root .

      - name: check-personal-details on the real repository (no Windows home path, drive-letter path or unallowed IPv4 address in a tracked file)
        run: bash scripts/check-personal-details.sh --root . --allow tests/personal-details/coldmail-platform.allow

      # Reads the Actions API for the head SHAs the documents call verified (green / done / CLOSED): GH_TOKEN is this job's own read-only token, never a secret of the repository.
      # A wired gate whose script is absent is red (bash cannot open it), never skipped: a gate that did not run must not read as green.
      - name: check-verified-heads on the real repository (a document may call a head verified only when the heavy workflows ran, green, on that exact SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-verified-heads.sh
