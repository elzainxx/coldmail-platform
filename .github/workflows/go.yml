# Go: format, build, vet, unit tests, and the per-package test-count floor — all on a GitHub runner, which is the only admissible evidence.
#
# `go test ./...` here never needs a database: the integration tests live in tests/harness behind the build tag `harness` and run in the
# `harness` workflow against a real Postgres. A test that cannot run must FAIL, never skip, so the floor gate also fails on any skipped test.
#
# The floor gate (scripts/check-test-floors.sh) reads the two logs this job captures: it asserts, per package, that the tests that RAN equal the
# tests DECLARED (`go test -list`), meet the floor in tests/floors-go.txt, none were skipped or failed, and that the SET of packages with tests
# equals the set in the floors file — so a vanished package, or a new package nobody gave a floor, is red.
# No module/build cache: a green must not be earned from a stale artifact (class 13).
#
# WHEN IT RUNS (the trigger economy of the public-release pass): on a push or pull request that touches something this job reads, and on dispatch. Path set = what the job
# really reads: every Go file (the module is cmd/, internal/ and tests/; `**/*.go` also catches a Go directory added later), go.mod / go.sum, the files the unit tests read
# from outside their package (internal/charge reads db/migrations and Docs/phase-2-spec.md; the three reference tests read Docs/config-reference.md, Docs/migrator-reference.md and
# Docs/probe-reference.md), the floor gate and its floors file (tests/**), and this file. A commit that touches only other prose (Docs/history, the cross-module records, the README) starts nothing here.
# A push of a `v*` or `phase-*` tag always runs it (GitHub does not evaluate path filters for a tag push), so tagging a head puts a run of this workflow on that exact SHA.
# A newer run on the same ref cancels the older one (the newer run covers the older commit's changes).
name: go
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'phase-*'
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'tests/**'
      - '!tests/license-canonical.txt'
      - '!tests/personal-details/**'
      - 'db/migrations/**'
      - 'Docs/config-reference.md'
      - 'Docs/migrator-reference.md'
      - 'Docs/probe-reference.md'
      - 'Docs/phase-2-spec.md'
      - 'scripts/check-test-floors.sh'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'tests/**'
      - '!tests/license-canonical.txt'
      - '!tests/personal-details/**'
      - 'db/migrations/**'
      - 'Docs/config-reference.md'
      - 'Docs/migrator-reference.md'
      - 'Docs/probe-reference.md'
      - 'Docs/phase-2-spec.md'
      - 'scripts/check-test-floors.sh'
      - '.github/workflows/go.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Toolchain (printed, so a run says what it ran on)
        run: |
          go version
          go env GOFLAGS GOTOOLCHAIN

      - name: gofmt — nothing may need formatting
        run: |
          out="$(gofmt -l cmd internal tests)"   # never `.`: Docs/ holds preserved raw Go sources (Docs/go.mod keeps them out of the module)
          if [ -n "$out" ]; then echo "gofmt would change:"; echo "$out"; exit 1; fi
          echo "gofmt: clean"

      - name: Build
        run: go build ./...

      - name: Vet (plain, with the harness tag so the integration tests are compiled too, and with the fault-point tag so the armed build keeps compiling)
        run: |
          go vet ./...
          go vet -tags harness ./...
          go vet -tags "harness m1node m2worker gotrue" ./tests/harness/    # the scoped stages' tests (dormant in the full harness, tests/harness/run.sh FULL_INCLUDES) must keep compiling
          go vet -tags faultpoints ./internal/... ./cmd/...                  # vet only: nothing here builds or runs a tagged binary (scripts/check-faultpoints.sh allows the tag on this one kind of line)

      - name: Unit tests (verbose log captured for the floor gate)
        run: |
          set -o pipefail
          go test -race -v -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-run.log"

      - name: Declared tests (go test -list, captured for the floor gate)
        run: |
          set -o pipefail
          go test -list '.*' ./... 2>&1 | tee "$RUNNER_TEMP/go-list.log"

      - name: Per-package test-count floor
        run: bash scripts/check-test-floors.sh --floors tests/floors-go.txt --go-run-log "$RUNNER_TEMP/go-run.log" --go-list-log "$RUNNER_TEMP/go-list.log"
